<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
    <!-- Main Feed Column -->
    <main class="lg:col-span-8 flex flex-col gap-6">
      <!-- Create Post Card -->
      <app-create-post
        [username]="name()"
        [photo]="photo()"
        (postCreated)="getAllPost()"
        ngSkipHydration
      ></app-create-post>

      <!-- Suggestions for mobile displayed between create post and posts list -->
      <div class="lg:hidden rounded-2xl border border-slate-200/70 bg-white p-4 shadow-sm">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="flex items-center gap-2.5">
            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm shadow-xs">
              <i class="fa-solid fa-user-plus text-xs"></i>
            </span>
            <div>
              <h2 class="font-bold text-slate-900 text-sm leading-tight">Who to follow</h2>
              <p class="text-[11px] text-slate-400">People you might know</p>
            </div>
          </div>
          <button
            type="button"
            (click)="flag = !flag"
            class="text-blue-600 hover:text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 hover:bg-blue-100/70 transition-colors cursor-pointer"
          >
            {{ flag ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (flag) {
          <div class="mt-3 overflow-y-auto max-h-[280px]">
            <app-suggestions ngSkipHydration></app-suggestions>
          </div>
        }
      </div>

      <!-- Feed Posts Container -->
      <div class="flex flex-col gap-5">
        @for (post of postList(); track post._id) {
          <app-single-post
            [post]="post"
            [currentUserId]="userId()"
            (postShared)="getAllPost()"
            (postDeleted)="onPostDeleted($event)"
            ngSkipHydration
          ></app-single-post>
        }
      </div>
    </main>

    <!-- Sidebar ("Who to Follow") Desktop -->
    <aside class="hidden lg:block lg:col-span-4 sticky top-20 self-start">
      <div class="rounded-2xl border border-slate-200/70 bg-white p-4 shadow-sm">
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 mb-2 border-b border-slate-100">
          <div class="flex items-center gap-2.5">
            <span
              class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm shadow-xs"
            >
              <i class="fa-solid fa-user-plus text-xs"></i>
            </span>
            <div>
              <h2 class="font-bold text-slate-900 text-sm leading-tight">Who to follow</h2>
              <p class="text-xs text-slate-400 font-medium">People you might know</p>
            </div>
          </div>
          <!-- Live pulse badge -->
          <span
            class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-600"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
            Live
          </span>
        </div>

        <!-- Suggestions list with smooth scrollbar -->
        <div
          class="w-full overflow-y-auto max-h-[calc(100vh-14rem)] divide-y divide-slate-100/70"
        >
          <app-suggestions ngSkipHydration></app-suggestions>
        </div>

        <!-- Sidebar footer -->
        <div
          class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium px-1"
        >
          <span class="hover:text-slate-600 cursor-pointer transition-colors">Privacy · Terms · Cookies</span>
          <span>Route Posts © 2026</span>
        </div>
      </div>
    </aside>
  </div>
</div>
