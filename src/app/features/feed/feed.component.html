<section class="grid grid-cols-12 gap-4 lg:mt-16 py-16">
  <div class="col-span-12 lg:col-span-9 flex flex-col">
    <app-create-post
      [username]="name()"
      [photo]="photo()"
      (postCreated)="getAllPost()"
      class="order-1"
      ngSkipHydration
    ></app-create-post>

    <!-- Suggestions for mobile displayed between create post and posts list using order-2 -->
    <div class="lg:hidden order-2 my-4 bg-white py-3 rounded-base">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold px-4 leading">Suggestions</h2>
        <span (click)="flag = !flag" class="text-primary text-sm px-4 font-bold cursor-pointer">{{
          flag ? 'hide' : 'show'
        }}</span>
      </div>
      @if (flag) {
        <div class="mt-3 rounded-base shadow-sm bg-base-100 p-2 overflow-y-auto max-h-[300px]">
          <!-- here append list of suggestions -->
          <app-suggestions ngSkipHydration></app-suggestions>
        </div>
      }
    </div>

    <!-- Posts container displayed after suggestions using order-3 -->
    <div class="w-full lg:w-2/3 mx-auto mt-6 order-3">
      @for (post of postList(); track post._id) {
        <app-single-post
          [post]="post"
          [currentUserId]="userId()"
          (postShared)="getAllPost()"
          (postDeleted)="onPostDeleted($event)"
          ngSkipHydration
        ></app-single-post>
      }
    </div>
  </div>

  <div
    class="hidden lg:block lg:col-span-3 lg:sticky lg:top-24 lg:self-start bg-white rounded-2xl border border-slate-100 shadow-sm p-4"
  >
    <!-- Header الكارد -->
    <div class="flex items-center justify-between pb-3 mb-2 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <span
          class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm shadow-xs"
        >
          <i class="fa-solid fa-user-plus"></i>
        </span>
        <div>
          <h2 class="font-bold text-slate-800 text-base leading-tight">Who to follow</h2>
          <p class="text-xs text-slate-400 font-medium">People you might know</p>
        </div>
      </div>
      <!-- مؤشر نابض يدي إحساس بالحيوية -->
      <span
        class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
        Live
      </span>
    </div>

    <!-- قائمة الاقتراحات مع Scrollbar ناعم -->
    <div
      class="w-full overflow-y-auto max-h-[calc(100vh-14rem)] pr-1 divide-y divide-slate-50 space-y-1"
    >
      <app-suggestions ngSkipHydration></app-suggestions>
    </div>

    <!-- Footer خفيف وبسيط للشياكة -->
    <div
      class="pt-3 mt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400 font-medium px-1"
    >
      <span class="hover:text-slate-600 cursor-pointer transition-colors">Privacy · Terms</span>
      <span>Social App © 2026</span>
    </div>
  </div>
</section>
