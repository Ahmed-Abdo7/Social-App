@for (follow of following(); track follow._id) {
  <div
    class="group flex items-center justify-between py-2.5 px-1 rounded-xl hover:bg-slate-50 transition-colors duration-150"
  >
    <!-- User Avatar & Info -->
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="relative shrink-0">
        <img
          [src]="follow.photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
          [alt]="follow.name"
          class="w-10 h-10 rounded-full object-cover ring-2 ring-slate-100 shadow-2xs group-hover:ring-blue-200 transition-all"
        />
      </div>

      <div class="flex flex-col min-w-0">
        <span
          class="text-xs font-bold text-slate-900 truncate hover:text-blue-600 cursor-pointer transition-colors"
        >
          {{ follow.name }}
        </span>
        <span class="text-[11px] text-slate-400 truncate">&#64;{{ follow.username }}</span>
        @if (follow.mutualFollowersCount) {
          <span class="text-[10px] text-slate-400 flex items-center gap-1 mt-0.5">
            <i class="fa-solid fa-user-group text-[9px] text-blue-400"></i>
            {{ follow.mutualFollowersCount }} mutual
          </span>
        }
      </div>
    </div>

    <!-- Follow Button: Modern high-contrast small pill -->
    <button
      (click)="followUser(follow._id)"
      class="shrink-0 ml-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full transition-all active:scale-95 cursor-pointer shadow-xs"
    >
      Follow
    </button>
  </div>
} @empty {
  <!-- Empty State -->
  <div class="py-8 text-center text-slate-400 flex flex-col items-center justify-center gap-2">
    <div
      class="w-11 h-11 rounded-full bg-slate-100 flex items-center justify-center text-slate-400"
    >
      <i class="fa-solid fa-user-check text-base"></i>
    </div>
    <p class="text-xs font-medium text-slate-500">No new suggestions right now</p>
  </div>
}
