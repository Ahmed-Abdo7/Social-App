
@for(follow of following() ; track follow._id){
    <div class="bg-gray-100 rounded-md px-2 py-1.5 my-1">
     <div class="flex items-center justify-between gap-2 w-full py-2 ">
    <div class="flex items-center gap-2  ">
        <img src="{{follow.photo}}" alt="" class="w-8 h-8 rounded-full">
        <div class="flex flex-col">
            <span class="text-sm">{{follow.name}}</span>
            <span class="text-xs text-gray-500">@{{follow.username}}</span>
            <span class="text-xs text-gray-500 ">{{follow.mutualFollowersCount}} mutual friends</span>
        </div>
    </div>
    <div (click)="followUser(follow._id)" class=" cursor-pointer text-blue-500 hover:text-white hover:bg-sky-600 bg-sky-200 transition-all px-1 py-2 rounded-base ">
        <i class="fa-solid fa-user-plus"></i>Follow
    </div>
</div>
</div>
}
