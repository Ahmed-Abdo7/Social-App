@for (post of postList(); track post._id) {
  <div class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden mb-5">
    <!-- User Header -->
    <div class="flex items-center justify-between p-4 pb-3">
      <div class="flex items-center gap-3">
        <img
          class="w-10 h-10 rounded-full object-cover border border-gray-100"
          [src]="
            post.user?.photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'
          "
          alt="User avatar"
        />
        <div>
          <h3 class="text-sm font-bold text-gray-900 leading-tight hover:underline cursor-pointer">
            {{ post.user?.name }}
          </h3>
          <div class="flex items-center gap-1.5 text-xs text-gray-500 mt-0.5">
            <span class="hover:underline cursor-pointer">&#64;{{ post.user?.username }}</span>
            <span>•</span>
            <span>{{ post.createdAt | date: 'd MMM' }}</span>
            <span>•</span>
            <span class="flex items-center gap-1">
              <i class="fa-solid fa-earth-americas text-[10px]"></i>
              <span>Public</span>
              <i class="fa-solid fa-chevron-down text-[8px] ml-0.5"></i>
            </span>
          </div>
        </div>
      </div>
      <button
        class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-50 transition-colors cursor-pointer"
      >
        <i class="fa-solid fa-ellipsis"></i>
      </button>
    </div>

    <!-- Post Body Content -->
    <div class="px-4 pb-3">
      <p class="text-[15px] text-gray-900 leading-normal whitespace-pre-wrap">{{ post.body }}</p>
    </div>

    <!-- Post Image -->
    @if (post.image) {
      <div class="w-full overflow-hidden bg-gray-50 border-y border-gray-100">
        <img
          [src]="post.image"
          alt="Post attachment"
          class="w-full h-auto max-h-[500px] object-cover hover:scale-[1.005] transition-transform duration-300"
        />
      </div>
    }

    <!-- Engagement Stats Row -->
    <div class="px-4 py-3 flex items-center justify-between text-xs text-gray-500">
      <!-- Likes -->
      <div class="flex items-center gap-1.5">
        <span class="w-4 h-4 rounded-full bg-blue-500 flex items-center justify-center text-white">
          <i class="fa-solid fa-thumbs-up text-[9px]"></i>
        </span>
        <span class="hover:underline cursor-pointer font-medium text-gray-600">
          {{ post.likesCount }} likes
        </span>
      </div>

      <!-- Shares / Comments / View Details -->
      <div class="flex items-center gap-3 font-medium text-gray-600">
        <span class="flex items-center gap-1">
          <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
          <span>{{ post.sharesCount }} shares</span>
        </span>
        <span class="hover:underline cursor-pointer"> {{ post.commentsCount }} comments </span>
        <span class="text-blue-600 hover:underline cursor-pointer font-bold"> View details </span>
      </div>
    </div>
  </div>
}
