<div class="p-3 w-full lg:w-2/3 mx-auto bg-white rounded">
  <div class="shadow rounded p-1">
    <!-- avatar  -->
    <div class="mb-3 flex items-center gap-2">
      <img class="w-12 h-12 rounded-full" [src]="photo" alt="" />
      <h2 class="text-primary- strong text-sm font-bold">{{ username }}</h2>
    </div>

    <form [formGroup]="createForm" (submit)="onSubmit($event)">
      <div class="mb-3">
        <textarea
          formControlName="body"
          id="message"
          rows="4"
          class="bg-gray-100 focus:bg-white border border-default-medium text-heading text-sm rounded-base focus:ring-0 focus:border-brand block w-full p-2.5 shadow-xs placeholder:text-body"
          placeholder="What 's on your mind ?"
        ></textarea>
      </div>

      <hr class="my-2" />
      @if (isSlected) {
        <div class="mb-3">
          <div
            class="p-4 mb-4 text-sm text-fg-success-strong rounded-base bg-success-soft"
            role="alert"
          >
            <span class="font-medium">Success </span> Your file has been selected successfully.
          </div>
        </div>
      }

      <div>
        <div class="flex flex-wrap justify-between gap-2">
          <div>
            <div class="flex items-center flex-wrap gap-2">
              <!-- الإنبوت الحقيقي (مخفي) -->
              <input
                type="file"
                id="imageUpload"
                class="hidden"
                accept="image/*"
                (change)="onFileSelected($event)"
              />

              <!-- الديزاين بتاع زرار Photo/video (مربوط بالإنبوت عن طريق for="imageUpload") -->
              <label
                for="imageUpload"
                class="flex items-center gap-2 cursor-pointer p-2 rounded-md hover:bg-gray-100 transition-all text-gray-600 font-semibold text-sm"
              >
                <svg
                  class="w-6 h-6 text-green-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                  ></path>
                </svg>
                Photo/video
              </label>

              <!-- زرار Feeling/activity (شكلي بس للتوضيح) -->
              <a
                class="flex items-center gap-1 rounded-md hover:bg-gray-100 transition-all text-gray-600 font-semibold text-sm"
              >
                <svg
                  class="w-6 h-6 text-yellow-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                Feeling/activity
              </a>
            </div>
          </div>
          <div>
            <button
              type="submit"
              class="bg-blue-500 hover:bg-blue-600 text-white px-4 md:px-6 py-1 rounded-sm cursor-pointer transition-all"
            >
              Post
              <i class="fa-regular fa-paper-plane"></i>
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
