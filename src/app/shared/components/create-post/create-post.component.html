<div class="bg-white rounded-2xl border border-slate-200/70 p-4 shadow-sm hover:shadow-md transition-shadow duration-200">
  <!-- Author Header -->
  <div class="mb-3.5 flex items-center gap-3">
    <img
      class="w-10 h-10 rounded-full object-cover ring-2 ring-slate-100"
      [src]="photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
      alt="User avatar"
    />
    <div>
      <h2 class="text-sm font-semibold text-slate-900 leading-tight">{{ username || 'User' }}</h2>
      <span class="text-xs text-slate-400">Share with community</span>
    </div>
  </div>

  <form [formGroup]="createForm" (submit)="onSubmit($event)">
    <!-- Textarea input -->
    <div class="mb-3">
      <textarea
        formControlName="body"
        id="message"
        rows="3"
        class="w-full p-3.5 text-sm text-slate-800 placeholder:text-slate-400 bg-slate-50/70 focus:bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all resize-none leading-relaxed"
        placeholder="What's on your mind?"
      ></textarea>
    </div>

    <!-- Upload Indicator Alert -->
    @if (isSlected) {
      <div class="mb-3 flex items-center justify-between p-2.5 rounded-xl bg-emerald-50 border border-emerald-200/60 text-emerald-800 text-xs font-medium animate-fade-in">
        <div class="flex items-center gap-2 min-w-0">
          <i class="fa-solid fa-circle-check text-emerald-600 text-sm"></i>
          <span class="truncate">Photo selected: {{ uploadFile?.name || 'Ready to post' }}</span>
        </div>
        <button
          type="button"
          (click)="uploadFile = null; isSlected = false"
          class="text-emerald-700 hover:text-emerald-900 p-1 rounded-md hover:bg-emerald-100/60 transition-colors cursor-pointer"
        >
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>
    }

    <!-- Bottom Actions Toolbar -->
    <div class="pt-2 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
      <!-- Media Attachment Buttons -->
      <div class="flex items-center gap-1">
        <!-- Hidden File Input -->
        <input
          type="file"
          id="imageUpload"
          class="hidden"
          accept="image/*"
          (change)="onFileSelected($event)"
        />

        <!-- Photo / Video Button -->
        <label
          for="imageUpload"
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 text-sm font-medium cursor-pointer transition-colors"
        >
          <i class="fa-regular fa-image text-emerald-500 text-base"></i>
          <span>Photo/Video</span>
        </label>

        <!-- Feeling / Activity Button -->
        <button
          type="button"
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 text-sm font-medium transition-colors cursor-pointer"
        >
          <i class="fa-regular fa-face-smile text-amber-500 text-base"></i>
          <span class="hidden sm:inline">Feeling/Activity</span>
        </button>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="inline-flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-medium px-5 py-2 rounded-xl shadow-sm hover:shadow-blue-500/20 active:scale-[0.98] transition-all cursor-pointer text-sm"
      >
        <span>Post</span>
        <i class="fa-regular fa-paper-plane text-xs"></i>
      </button>
    </div>
  </form>
</div>
