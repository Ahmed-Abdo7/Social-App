<div class="bg-[#F7F8FA] h-fit p-4 w-full mt-2 rounded-md ">
    <div class="bg-white my-3  p-4 rounded-md shadow ">
        <p class="text-gray-600 text-sm font-bold  ">Comments <span class="text-gray-600 bg-sky-100 rounded-full p-1 text-xs mx-2">{{comments().length}}</span></p>
    </div>
       @for(comment of comments(); track comment._id){
        <div class="flex flex-wrap justify-start mb-3 bg-[#F7F8FA] h-fit p-4  rounded-md ">
         <div class="w-10 h-10 rounded-full ">
            <img [src]="comment.commentCreator.photo" [alt]="comment.commentCreator.name">
        </div>
        <div class="flex-1 flex flex-col justify-start ">
            <div class="bg-[#F0F2F5] p-2 rounded-md w-fit ">
                <h3 class="font-semibold text-md">{{comment.commentCreator.name}}</h3>
                <p>{{comment.content}}</p>
                @if(comment.image){
                    <div class=" w-[300px] h-fit">
                        <img  [src]="comment.image" alt="">
                    </div>
                }
            </div>
            <div class="flex gap-4 ">
                <button class="text-gray-600 hover:text-blue-600 text-sm">{{comment.createdAt | date:'d MMM'}}</button>
                <button (click)="putLikeToComment(postId , comment._id)" class="text-gray-600 hover:text-blue-600 text-sm"> Like  ({{ comment.likesCount ?? comment.likes?.length ?? 0 }})</button>
                <button class="text-gray-600 hover:text-blue-600 text-sm">Reply</button>  
            </div>
        </div>       
    </div>
}
    <!-- 2. مربع كتابة الكومنت -->
    <form [formGroup]= "createComment"   (submit)="createCommentSubmit($event)"  >
      <div class="flex gap-3 items-start">
        <!-- صورة المستخدم (تقدر تغير الـ src بتاعها) -->
              <img class=" w-12 h-12 rounded-full " src="https://flowbite.com/docs/images/people/profile-picture-5.jpg" alt="">

        <!-- حاوية الإدخال (Input Container) -->
        <div class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl p-3 shadow-sm">

          <!-- مكان الكتابة -->
          <!-- ضفنا focus:outline-none و focus:ring-0 -->
          <textarea formControlName="content" rows="2" 
            class="w-full bg-transparent resize-none outline-none focus:outline-none focus:ring-0 border-none text-slate-700 placeholder-slate-500 text-sm"
            placeholder="Comment as Ahmed Abdo..."></textarea>

          <!-- الشريط السفلي (الأيقونات وزرار الإرسال) -->
          <!-- الأيقونات اللي على الشمال -->
          <div class="flex gap-3 text-slate-500 items-center justify-between ">

            <!-- زرار الصورة بعد التعديل -->
            <div class="flex flex-wrap gap-2">
              <!-- الإنبوت المخفي -->
              <input   type="file" id="commentImage" class="hidden" accept="image/*" (change)="onFileSelected($event)">
              <!-- الـ Label اللي بيشغل الإنبوت لما تدوس عليه -->
              <label for="commentImage" class="hover:text-blue-500 transition-colors cursor-pointer flex items-center">
                <i class="fa-regular fa-image text-lg"></i>
              </label>
              <!-- زرار السمايل (الإيموجي) -->
              <button class="hover:text-blue-500 transition-colors cursor-pointer flex items-center">
                <i class="fa-regular fa-face-smile text-lg"></i>
              </button>
            </div>


            <!-- زرار الإرسال على اليمين -->
            <div class="flex justify-end mt-2">
              <button type="submit"
                class="bg-blue-500 text-white px-4 py-1 rounded-full text-sm font-semibold hover:bg-blue-600 transition-colors">Post</button>
            </div>

          </div>

        </div>
      </div>
    </form>
</div>
