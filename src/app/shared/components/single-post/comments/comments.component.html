<div class="bg-slate-50/80 border-t border-slate-100 p-4 w-full">
  <!-- Comments Count Header -->
  <div class="flex items-center justify-between mb-3.5">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-800 uppercase tracking-wider">Comments</span>
      <span class="text-xs font-semibold text-blue-600 bg-blue-50 border border-blue-100/60 rounded-full px-2 py-0.5">
        {{ comments().length }}
      </span>
    </div>
  </div>

  <!-- Comments List -->
  <div class="space-y-3 mb-4">
    @for (comment of comments(); track comment._id) {
      <div class="flex items-start gap-3">
        <img
          class="w-8 h-8 rounded-full object-cover ring-1 ring-slate-200 shrink-0 mt-0.5"
          [src]="comment.commentCreator.photo || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
          [alt]="comment.commentCreator.name"
        />
        <div class="flex-1 min-w-0">
          <div class="bg-white border border-slate-200/70 p-3 rounded-2xl shadow-2xs">
            <div class="flex items-center justify-between gap-2 mb-1">
              <h4 class="font-semibold text-xs text-slate-900 truncate">{{ comment.commentCreator.name }}</h4>
              <span class="text-[10px] text-slate-400 shrink-0">{{ comment.createdAt | date: 'd MMM' }}</span>
            </div>
            <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-wrap">{{ comment.content }}</p>
            @if (comment.image) {
              <div class="mt-2 rounded-xl overflow-hidden max-w-xs border border-slate-100">
                <img [src]="comment.image" alt="Comment attachment" class="w-full h-auto object-cover" />
              </div>
            }
          </div>
          <!-- Comment Actions -->
          <div class="flex items-center gap-3 text-[11px] text-slate-500 mt-1 ml-2 font-medium">
            <button
              (click)="putLikeToComment(postId, comment._id)"
              class="hover:text-blue-600 transition-colors cursor-pointer"
            >
              Like ({{ comment.likesCount ?? comment.likes?.length ?? 0 }})
            </button>
            <button class="hover:text-blue-600 transition-colors cursor-pointer">
              Reply
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Write Comment Box -->
  <form [formGroup]="createComment" (submit)="createCommentSubmit($event)">
    <div class="flex gap-2.5 items-start">
      <img
        class="w-8 h-8 rounded-full object-cover ring-1 ring-slate-200 shrink-0 mt-1"
        [src]="photo() || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
        alt="Your profile"
      />
      <div class="flex-1 bg-white border border-slate-200/80 rounded-2xl p-2.5 shadow-2xs focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 transition-all">
        <textarea
          formControlName="content"
          rows="2"
          class="w-full bg-transparent resize-none border-none outline-none focus:outline-none focus:ring-0 text-slate-800 placeholder:text-slate-400 text-xs leading-relaxed"
          placeholder="Write a comment..."
        ></textarea>
        <div class="flex items-center justify-between pt-1.5 border-t border-slate-100">
          <div class="flex items-center gap-1">
            <input type="file" id="commentImage" class="hidden" accept="image/*" (change)="onFileSelected($event)" />
            <label
              for="commentImage"
              class="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors cursor-pointer"
              title="Add image"
            >
              <i class="fa-regular fa-image text-sm"></i>
            </label>
            <button
              type="button"
              class="p-1.5 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-amber-50 transition-colors cursor-pointer"
              title="Add emoji"
            >
              <i class="fa-regular fa-face-smile text-sm"></i>
            </button>
          </div>
          <button
            type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1 rounded-xl text-xs font-semibold shadow-xs transition-colors cursor-pointer"
          >
            Reply
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
