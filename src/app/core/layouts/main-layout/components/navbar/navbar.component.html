<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
  <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8 py-2.5">
    <!-- Brand / Logo -->
    <a routerLink="/feed" class="flex items-center gap-3 group">
      <div
        class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white text-xs font-black tracking-wider w-9 h-9 flex items-center justify-center rounded-xl shadow-sm shadow-blue-500/20 group-hover:scale-105 transition-transform"
      >
        R
      </div>
      <span class="hidden sm:block text-lg font-bold text-slate-900 tracking-tight"
        >Route Posts</span
      >
    </a>

    <!-- Navigation Links Container -->
    <div class="flex items-center bg-slate-100/80 border border-slate-200/60 rounded-full p-1 gap-1">
      <!-- Feed Link -->
      <a
        routerLink="/feed"
        routerLinkActive="bg-white text-blue-600 shadow-xs font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all cursor-pointer text-xs font-medium"
      >
        <i class="fa-solid fa-house text-sm"></i>
        <span class="hidden md:inline">Feed</span>
      </a>

      <!-- Profile Link -->
      <a
        routerLink="/profile"
        routerLinkActive="bg-white text-blue-600 shadow-xs font-semibold"
        class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all cursor-pointer text-xs font-medium"
      >
        <i class="fa-regular fa-user text-sm"></i>
        <span class="hidden md:inline">Profile</span>
      </a>

      <!-- Notifications Link -->
      <a
        routerLink="/notifications"
        routerLinkActive="bg-white text-blue-600 shadow-xs font-semibold"
        class="relative flex items-center gap-2 px-3.5 py-1.5 rounded-full text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all cursor-pointer text-xs font-medium"
      >
        <i class="fa-regular fa-bell text-sm"></i>
        <span class="hidden md:inline">Notifications</span>
        @if (+unreadCount() > 0) {
          <span
            class="inline-flex items-center justify-center min-w-[18px] h-4.5 px-1.5 text-[11px] font-semibold text-white bg-blue-600 rounded-full shadow-xs ring-2 ring-white"
          >
            {{ unreadCount() }}
          </span>
        }
      </a>
    </div>

    <!-- User Profile Dropdown Trigger -->
    <div class="relative">
      <button
        (click)="isDropdownOpen = !isDropdownOpen"
        class="flex items-center gap-2.5 p-1 pl-1 pr-3 rounded-full border border-slate-200/80 bg-white hover:bg-slate-100 transition-colors cursor-pointer shadow-xs focus:outline-none focus:ring-2 focus:ring-blue-500/20"
        aria-label="User navigation menu"
      >
        <img
          [src]="photo() || 'https://flowbite.com/docs/images/people/profile-picture-5.jpg'"
          alt="Profile photo"
          class="w-8 h-8 rounded-full object-cover ring-1 ring-slate-200"
        />
        <span class="hidden md:block font-semibold text-slate-800 text-xs">Account</span>
        <i
          class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform duration-200 ml-0.5"
          [class.rotate-180]="isDropdownOpen"
        ></i>
      </button>

      <!-- Dropdown Menu -->
      @if (isDropdownOpen) {
        <div
          class="absolute right-0 top-full mt-2 w-52 bg-white rounded-2xl shadow-lg border border-slate-100 py-1.5 z-50 flex flex-col gap-0.5 animate-scale-in"
        >
          <div class="px-3.5 py-2 border-b border-slate-100">
            <p class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Signed in</p>
            <p class="text-xs font-semibold text-slate-800 truncate">Route Community</p>
          </div>

          <a
            routerLink="/profile"
            (click)="isDropdownOpen = false"
            class="flex items-center gap-2.5 px-3.5 py-2 mx-1 rounded-xl text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer text-xs font-medium"
          >
            <i class="fa-regular fa-user text-sm text-slate-400"></i>
            <span>Profile</span>
          </a>

          <a
            routerLink="/change-password"
            (click)="isDropdownOpen = false"
            class="flex items-center gap-2.5 px-3.5 py-2 mx-1 rounded-xl text-slate-700 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer text-xs font-medium"
          >
            <i class="fa-solid fa-gear text-sm text-slate-400"></i>
            <span>Settings</span>
          </a>

          <hr class="my-1 border-slate-100" />

          <button
            (click)="removeToken(); isDropdownOpen = false"
            routerLink="/login"
            class="w-full flex items-center gap-2.5 px-3.5 py-2 mx-1 rounded-xl text-rose-600 hover:bg-rose-50 transition-colors cursor-pointer text-left text-xs font-medium"
          >
            <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</nav>
